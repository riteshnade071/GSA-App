<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpportunityHub</title>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#241B36; --soft:#6B5E7D; --line:#E3DCEF; --bg:#F8F6FC; --card:#fff;
          --brand:#6B21A8; --accent:#9333EA; --good:#F0E5FB; --warn:#F5EDFC; }
  *{box-sizing:border-box} body{margin:0;font-family:'Work Sans',sans-serif;background:var(--bg);color:var(--ink)}
  .top{background:var(--brand);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
  .top h1{font-size:17px;margin:0}
  .top button{background:none;border:none;color:#D8BEEE;font-size:12.5px;text-decoration:underline;cursor:pointer}
  .wrap{max-width:720px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
  h2{font-size:18px;margin:0 0 4px;color:var(--brand)} .hint{color:var(--soft);font-size:13px;margin-bottom:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  label{display:block;font-size:12px;font-weight:600;color:var(--soft);margin-bottom:4px}
  input,select{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit}
  .btn{padding:12px 22px;border:none;border-radius:8px;background:var(--brand);color:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
  .btn:disabled{background:#D9D0E8;cursor:not-allowed}
  .btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
  .msg{font-size:13px;margin-top:8px} .msg.err{color:#A6301E}
  .opp{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:16px;margin-bottom:12px;background:#fff}
  .opp.high{border-left-color:#6B21A8} .opp.partial{border-left-color:var(--accent)}
  .opp h3{margin:0 0 4px;font-size:15.5px}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;margin-bottom:8px}
  .tag.high{background:var(--good);color:#6B21A8} .tag.partial{background:var(--warn);color:#9333EA}
  .opp p{font-size:13px;color:var(--soft);margin:6px 0}
  .src{font-size:11.5px;color:var(--soft);border-top:1px dashed var(--line);padding-top:8px;margin-top:10px}
  .src a{color:var(--brand);font-weight:600}
  .empty{text-align:center;color:var(--soft);padding:36px 12px;font-size:14px}
  .row{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="top"><h1>OpportunityHub</h1><button id="logoutBtn" onclick="logout()" style="display:none">Log out</button></div>
<div class="wrap">

  <!-- LOGIN -->
  <div class="card" id="authCard">
    <h2 id="authTitle">Create your account</h2>
    <div class="hint">Ek profile banao — government schemes, scholarships aur study-abroad options sab ek jagah.</div>
    <div class="grid">
      <div id="nameField"><label>Name</label><input id="a_name" placeholder="Your name"/></div>
      <div><label>Phone</label><input id="a_phone" placeholder="10-digit number"/></div>
      <div><label>Password</label><input id="a_pass" type="password" placeholder="Choose a password"/></div>
    </div>
    <div class="row">
      <button class="btn" id="authBtn" onclick="doAuth()">Create account</button>
      <button class="btn btn-ghost" onclick="toggleAuth()" id="toggleBtn">I already have an account</button>
    </div>
    <div class="msg" id="authMsg"></div>
  </div>

  <!-- PROFILE -->
  <div class="card" id="profileCard" style="display:none">
    <h2>Your details</h2>
    <div class="hint">Jitna bharoge, utna sahi match milega. Khali chhoda hua field match rokta nahi — bas "check karo" dikhayega.</div>
    <div class="grid">
      <div><label>State</label><input id="p_state" placeholder="e.g. Maharashtra"/></div>
      <div><label>Age</label><input id="p_age" type="number" placeholder="18"/></div>
      <div><label>Gender</label><select id="p_gender"><option value="">Select</option><option>male</option><option>female</option><option>other</option></select></div>
      <div><label>Education level</label><select id="p_edu"><option value="">Select</option><option>10th</option><option>12th</option><option>diploma</option><option>bachelors</option><option>masters</option></select></div>
      <div><label>Marks %</label><input id="p_marks" type="number" placeholder="82"/></div>
      <div><label>Stream</label><select id="p_stream"><option value="">Select</option><option>science</option><option>commerce</option><option>arts</option><option>engineering</option></select></div>
      <div><label>Family income (yearly ₹)</label><input id="p_income" type="number" placeholder="250000"/></div>
      <div><label>Category</label><select id="p_cat"><option value="">Select</option><option>general</option><option>obc</option><option>sc</option><option>st</option><option>ews</option><option>minority</option></select></div>
    </div>
    <div class="row"><button class="btn" onclick="saveProfile()">Save &amp; find opportunities</button><span class="msg" id="profMsg"></span></div>
  </div>

  <!-- MATCHES -->
  <div id="matchesSection" style="display:none">
    <div class="row" style="margin-bottom:14px">
      <button class="btn btn-ghost" onclick="showProfile()">Edit my details</button>
    </div>
    <div id="matchesList"></div>
  </div>

</div>

<script>
const API = "https://gsa-app.onrender.com";
let session = JSON.parse(localStorage.getItem("ohub_session") || "null");
let isLogin = false;

function headers(){ return session ? {"Authorization":"Bearer "+session.access_token} : {}; }
function jsonHeaders(){ return {"Content-Type":"application/json", ...headers()}; }

function toggleAuth(){
  isLogin = !isLogin;
  document.getElementById("authTitle").textContent = isLogin ? "Welcome back" : "Create your account";
  document.getElementById("authBtn").textContent = isLogin ? "Log in" : "Create account";
  document.getElementById("toggleBtn").textContent = isLogin ? "Create a new account" : "I already have an account";
  document.getElementById("nameField").style.display = isLogin ? "none" : "block";
}

async function doAuth(){
  const msg = document.getElementById("authMsg"); msg.className="msg"; msg.textContent="";
  const phone = document.getElementById("a_phone").value.trim();
  const password = document.getElementById("a_pass").value;
  const name = document.getElementById("a_name").value.trim();
  if(!phone || !password || (!isLogin && !name)){ msg.textContent="Sab fields bharo."; msg.classList.add("err"); return; }

  const body = isLogin ? {phone,password} : {name,phone,password};
  try{
    const res = await fetch(`${API}/auth/${isLogin?"login":"register"}`,
      {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const data = await res.json();
    if(!res.ok) throw new Error(data.detail || "Something went wrong");
    session = data;
    localStorage.setItem("ohub_session", JSON.stringify(session));
    enterApp(data.has_profile);
  }catch(e){ msg.textContent = e.message; msg.classList.add("err"); }
}

function logout(){ localStorage.removeItem("ohub_session"); location.reload(); }

function enterApp(hasProfile){
  document.getElementById("authCard").style.display="none";
  document.getElementById("logoutBtn").style.display="block";
  if(hasProfile) loadMatches(); else showProfile();
}

async function showProfile(){
  document.getElementById("matchesSection").style.display="none";
  document.getElementById("profileCard").style.display="block";
  try{
    const res = await fetch(`${API}/profile`,{headers:headers()});
    const p = await res.json();
    if(p){
      p.state && (document.getElementById("p_state").value = p.state);
      p.age && (document.getElementById("p_age").value = p.age);
      p.gender && (document.getElementById("p_gender").value = p.gender);
      p.education_level && (document.getElementById("p_edu").value = p.education_level);
      p.marks_percent && (document.getElementById("p_marks").value = p.marks_percent);
      p.course_stream && (document.getElementById("p_stream").value = p.course_stream);
      p.family_income && (document.getElementById("p_income").value = p.family_income);
      p.category && (document.getElementById("p_cat").value = p.category);
    }
  }catch{}
}

async function saveProfile(){
  const msg = document.getElementById("profMsg"); msg.className="msg"; msg.textContent="Saving…";
  const num = id => { const v = document.getElementById(id).value; return v ? Number(v) : null; };
  const str = id => document.getElementById(id).value || null;
  try{
    const res = await fetch(`${API}/profile`,{method:"POST",headers:jsonHeaders(),body:JSON.stringify({
      country:"IN", state:str("p_state"), age:num("p_age"), gender:str("p_gender"),
      education_level:str("p_edu"), marks_percent:num("p_marks"), course_stream:str("p_stream"),
      family_income:num("p_income"), category:str("p_cat"), is_disabled:false
    })});
    if(!res.ok) throw new Error("Couldn't save");
    msg.textContent=""; loadMatches();
  }catch(e){ msg.textContent=e.message; msg.classList.add("err"); }
}

async function loadMatches(){
  document.getElementById("profileCard").style.display="none";
  const section = document.getElementById("matchesSection");
  const list = document.getElementById("matchesList");
  section.style.display="block";
  list.innerHTML = `<div class="empty">Finding opportunities for you…</div>`;
  try{
    const res = await fetch(`${API}/opportunities/matches`,{headers:headers()});
    const data = await res.json();
    if(!res.ok) throw new Error(data.detail || "Couldn't load");
    render(data.matches || []);
  }catch(e){ list.innerHTML = `<div class="empty">${e.message}</div>`; }
}

function render(matches){
  const list = document.getElementById("matchesList");
  if(!matches.length){
    list.innerHTML = `<div class="empty">Abhi koi matching opportunity nahi mili.<br>Apni details check karo ya baad me dekho — naye schemes add hote rehte hain.</div>`;
    return;
  }
  const high = matches.filter(m=>m.match==="high").length;
  list.innerHTML = `<div class="hint"><b>${matches.length} opportunities</b> mili — ${high} me tum poori tarah eligible lagte ho.</div>` +
    matches.map(m=>`
      <div class="opp ${m.match}">
        <span class="tag ${m.match}">${m.match==="high"?"Strong match":"Check eligibility"}</span>
        <h3>${esc(m.name)}</h3>
        ${m.description?`<p>${esc(m.description)}</p>`:""}
        ${m.benefits?`<p><b>Benefits:</b> ${esc(m.benefits)}</p>`:""}
        ${m.deadline?`<p><b>Deadline:</b> ${m.deadline}${m.days_left!=null?` (${m.days_left} days left)`:""}</p>`:""}
        ${m.unknown_fields.length?`<p>⚠️ Tumne ye nahi bhara: <b>${m.unknown_fields.join(", ")}</b> — official page pe khud check kar lo.</p>`:""}
        ${m.required_documents.length?`<p><b>Documents:</b> ${m.required_documents.map(esc).join(", ")}</p>`:""}
        <div class="src">
          Source: ${esc(m.source_organization||"—")} · Last verified: ${m.last_verified||"not verified yet"}<br>
          <a href="${esc(m.official_url)}" target="_blank" rel="noopener">Apply on the official site →</a>
        </div>
      </div>`).join("");
}

function esc(s){ const d=document.createElement("div"); d.textContent=s==null?"":s; return d.innerHTML; }

if(session) enterApp(true);
</script>
</body>
</html>
