<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpportunityHub</title>
<meta name="theme-color" content="#6B21A8">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sections.css">
<style>
  :root { --ink:#241B36; --soft:#6B5E7D; --line:#E3DCEF; --bg:#F8F6FC; --card:#fff;
          --brand:#6B21A8; --accent:#9333EA; --good:#F0E5FB; --warn:#F5EDFC; }
  *{box-sizing:border-box} body{margin:0;font-family:'Work Sans',sans-serif;background:var(--bg);color:var(--ink)}
  .top{background:var(--brand);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
  .top h1{font-size:17px;margin:0}
  .top button{background:none;border:none;color:#D8BEEE;font-size:12.5px;text-decoration:underline;cursor:pointer}
  .wrap{max-width:720px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
  h2{font-size:18px;margin:0 0 4px;color:var(--brand)} .hint{color:var(--soft);font-size:13px;margin-bottom:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  label{display:block;font-size:12px;font-weight:600;color:var(--soft);margin-bottom:4px}
  input,select{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit}
  .btn{padding:12px 22px;border:none;border-radius:8px;background:var(--brand);color:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
  .btn:disabled{background:#D9D0E8;cursor:not-allowed}
  .btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
  .msg{font-size:13px;margin-top:8px} .msg.err{color:#A6301E}
  .opp{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:16px;margin-bottom:12px;background:#fff}
  .opp.high{border-left-color:#6B21A8} .opp.partial{border-left-color:var(--accent)}
  .opp h3{margin:0 0 4px;font-size:15.5px}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;margin-bottom:8px}
  .tag.high{background:var(--good);color:#6B21A8} .tag.partial{background:var(--warn);color:#9333EA}
  .opp p{font-size:13px;color:var(--soft);margin:6px 0}
  .src{font-size:11.5px;color:var(--soft);border-top:1px dashed var(--line);padding-top:8px;margin-top:10px}
  .src a{color:var(--brand);font-weight:600}
  .empty{text-align:center;color:var(--soft);padding:36px 12px;font-size:14px}
  .tag.scope{background:#EEF3FF;color:#2F4FA3;margin-left:6px}
  details.steps{margin-top:10px;font-size:13px} details.steps summary{cursor:pointer;font-weight:700;color:var(--brand)}
  details.steps ol{margin:8px 0 0;padding-left:20px;color:var(--soft)} details.steps li{margin-bottom:9px} details.steps .hi{color:var(--ink);font-size:13.5px}
  .tag.urgent{background:#FDE2E0;color:#A6301E} .tag.soon{background:#FFF0D6;color:#9A5B1E} .tag.later{background:#E8F3EA;color:#1B7A4B}
  .chip{padding:7px 14px;border:1.5px solid var(--line);border-radius:18px;background:#fff;font-size:13px;font-family:inherit;cursor:pointer}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .opp p.amt{font-weight:700;color:var(--ink);font-size:14px} .opp p.why{color:#1B7A4B} .opp p.stale{color:#9A5B1E;font-size:12px}
  .applybtn{display:block;text-align:center;background:var(--brand);color:#fff!important;padding:12px;border-radius:8px;text-decoration:none;font-weight:700;margin-top:12px}
  .notice{border-top:1px dashed var(--line);padding:10px 0} .notice:first-of-type{border-top:none}
  .notice p{margin:4px 0;font-size:13px;color:var(--soft)} .notice a{color:var(--brand);font-weight:600;font-size:13px}
  .nmeta{display:block;font-size:11.5px;color:var(--soft);margin-top:2px}
  .appgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .tip{font-size:12.5px;color:var(--ink);background:var(--warn);padding:9px 11px;border-radius:8px;margin-top:10px}
  .tip.bad{background:#FDE8E4} .tip.good{background:#E8F3EA}
  .row{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="top"><h1>OpportunityHub</h1><button id="logoutBtn" onclick="logout()" style="display:none">Log out</button></div>
<nav class="hubnav" id="hubNav" aria-label="Sections">
  <button type="button" class="chip on" data-sec="scholarships">🎓 Scholarships</button>
  <button type="button" class="chip" data-sec="farmers">🌾 Farmers</button>
  <button type="button" class="chip" data-sec="careers">🧭 Career guidance</button>
</nav>
<div class="wrap" id="sec-scholarships">

  <div id="noticesBox"></div>
  <div id="accountBox"></div>

  <!-- LOGIN / SIGNUP / FORGOT PASSWORD -->
  <div class="card" id="authCard">
    <h2 id="authTitle">Create your account</h2>
    <div class="hint" id="authHint"></div>
    <div class="grid">
      <div id="nameField"><label>Name</label><input id="a_name" placeholder="Your name"/></div>
      <div><label>Phone</label><input id="a_phone" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="10-digit mobile number"/></div>
      <div id="emailField" style="grid-column:1/-1;display:none"><label id="emailLabel">Email</label><input id="a_email" type="email" autocomplete="off" placeholder="you@example.com"/></div>
      <div id="otpField" style="display:none"><label>OTP (6 digits)</label><input id="a_otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" oninput="cleanNum(this)" placeholder="Enter the code"/></div>
      <div id="passField" style="display:none"><label id="passLabel">Password</label><input id="a_pass" type="password" placeholder="At least 6 characters"/></div>
    </div>
    <div class="row">
      <button class="btn" id="otpBtn" onclick="sendOtp()">Send OTP</button>
      <button class="btn" id="verifyBtn" style="display:none" onclick="verifyOtp()">Verify OTP</button>
      <button class="btn" id="authBtn" style="display:none" onclick="doAuth()">Create account</button>
      <button class="btn btn-ghost" onclick="toggleAuth()" id="toggleBtn">I already have an account</button>
      <button class="btn btn-ghost" id="forgotBtn" style="display:none" onclick="startForgot()">Forgot password?</button>
    </div>
    <div class="msg" id="authMsg"></div>
  </div>

  <!-- PROFILE -->
  <div class="card" id="profileCard" style="display:none">
    <h2>Your details</h2>
    <div class="hint">Central (All India) schemes sabko dikhti hain, chahe koi bhi state ho. Jitna bharoge, utna sahi match milega. Khali chhoda hua field match rokta nahi — bas "check karo" dikhayega.</div>
    <div class="grid">
      <div><label>Home state (where you live)</label><select id="p_state"><option value="">Select</option></select></div>
      <div><label>State of your college (if different)</label><select id="p_study_state"><option value="">Same as home / not sure</option></select></div>
      <div><label>Age</label><input id="p_age" type="text" inputmode="numeric" autocomplete="off" oninput="cleanNum(this)" placeholder="18"/></div>
      <div><label>Gender</label><select id="p_gender"><option value="">Select</option><option>male</option><option>female</option><option>other</option></select></div>
      <div><label>Education level</label><select id="p_edu"><option value="">Select</option><option>10th</option><option>12th</option><option>diploma</option><option>bachelors</option><option>masters</option></select></div>
      <div><label>Marks %</label><input id="p_marks" type="text" inputmode="decimal" autocomplete="off" oninput="cleanNum(this,true)" placeholder="82"/></div>
      <div><label>Stream</label><select id="p_stream"><option value="">Select</option><option>science</option><option>commerce</option><option>arts</option><option>engineering</option></select></div>
      <div><label>Family income (yearly ₹)</label><input id="p_income" type="text" inputmode="numeric" autocomplete="off" oninput="cleanNum(this)" placeholder="250000"/></div>
      <div><label>Category</label><select id="p_cat"><option value="">Select</option><option>general</option><option>obc</option><option>sc</option><option>st</option><option>ews</option><option>sebc</option><option>vjnt</option><option>sbc</option><option>minority</option></select></div>
    </div>
    <div class="row"><button class="btn" onclick="saveProfile()">Save &amp; find opportunities</button><span class="msg" id="profMsg"></span></div>
  </div>

  <!-- MATCHES -->
  <div id="matchesSection" style="display:none">
    <div class="row" style="margin-bottom:14px">
      <button class="chip on" id="tabMatches" onclick="showTab('matches')">🎯 My scholarships</button>
      <button class="chip" id="tabApps" onclick="showTab('apps')">📋 My applications <span id="appCount"></span></button>
      <button class="btn btn-ghost" onclick="showProfile()">Edit my details</button>
    </div>
    <div id="matchesList"></div>
    <div id="appsList" style="display:none"></div>
  </div>

</div>

<div class="wrap wide" id="sec-farmers" style="display:none"></div>
<div class="wrap wide" id="sec-careers" style="display:none"></div>

<script>
const API = "https://gsa-app.onrender.com";
let session = JSON.parse(localStorage.getItem("ohub_session") || "null");
let mode = "signup", stage = "start", verifyToken = null, cooldownTimer = null, epoch = 0;
let CFG = {otp_required: true};
const STATES = ["Andhra Pradesh","Arunachal Pradesh","Assam","Bihar","Chhattisgarh","Goa","Gujarat","Haryana","Himachal Pradesh","Jharkhand","Karnataka","Kerala","Madhya Pradesh","Maharashtra","Manipur","Meghalaya","Mizoram","Nagaland","Odisha","Punjab","Rajasthan","Sikkim","Tamil Nadu","Telangana","Tripura","Uttar Pradesh","Uttarakhand","West Bengal","Delhi","Jammu and Kashmir","Ladakh","Puducherry","Chandigarh"];
for(const id of ["p_state","p_study_state"]) document.getElementById(id).innerHTML += STATES.map(s=>`<option>${s}</option>`).join("");

function headers(){ return session ? {"Authorization":"Bearer "+session.access_token} : {}; }
function jsonHeaders(){ return {"Content-Type":"application/json", ...headers()}; }

// Numbers-only helper: keeps only digits (and one dot for marks). Works on every browser/phone keyboard.
function cleanNum(el, decimal){ el.value = el.value.replace(decimal ? /[^0-9.]/g : /[^0-9]/g, ''); }

// Render's free server sleeps when idle; the first request can take 30-50 s. Tell the student instead of looking broken.
const WAKE_TEXT = "Server so raha tha, jag raha hai — 30-50 second lag sakte hain, please ruko…";
function wakeHint(el){ const t = setTimeout(()=>{ el.textContent = WAKE_TEXT; }, 6000); return ()=>clearTimeout(t); }

// Modes: signup | login | reset (forgot password).  Stages inside signup/reset: start -> sent -> verified.
// The code is always sent to the student's email (via the server); the server decides nothing else about delivery.
function show(id, on){ document.getElementById(id).style.display = on ? "" : "none"; }
function setMsg(text, kind){ const m = document.getElementById("authMsg"); m.className = "msg" + (kind ? " " + kind : ""); m.textContent = text || ""; }

function refreshAuthUI(){            // only shows/hides things; never clears what the student typed
  const needOtp = mode !== "login";
  const formReady = mode === "login" || (mode === "signup" && stage === "verified") || (mode === "reset" && stage === "sent");
  show("nameField", mode === "signup");
  show("emailField", needOtp && stage === "start");
  show("otpBtn", needOtp && stage !== "verified");
  show("otpField", needOtp && stage === "sent");
  show("verifyBtn", mode === "signup" && needOtp && stage === "sent");
  show("passField", formReady); show("authBtn", formReady); show("forgotBtn", mode === "login");
  document.getElementById("passLabel").textContent = mode === "reset" ? "New password" : mode === "signup" ? "Choose a password" : "Password";
  document.getElementById("authBtn").textContent = {signup: "Create account", login: "Log in", reset: "Reset password"}[mode];
  document.getElementById("emailLabel").textContent = mode === "reset" ? "Email you used when signing up" : "Email (the code is sent here)";
  document.getElementById("authHint").textContent = mode === "login" ? "Log in with your phone number and password."
    : "We verify your email with a one-time code (OTP). Your phone number is your login ID.";
}
function setMode(m){
  mode = m; stage = "start"; verifyToken = null; clearInterval(cooldownTimer);
  document.getElementById("a_phone").readOnly = false;
  for(const id of ["a_otp","a_pass"]) document.getElementById(id).value = "";
  document.getElementById("authTitle").textContent = {signup:"Create your account", login:"Welcome back", reset:"Reset your password"}[m];
  document.getElementById("toggleBtn").textContent = {signup:"I already have an account", login:"Create a new account", reset:"Back to log in"}[m];
  const otpBtn = document.getElementById("otpBtn"); otpBtn.textContent = "Send OTP"; otpBtn.disabled = false;
  setMsg(""); refreshAuthUI();
}
function toggleAuth(){ setMode(mode === "signup" ? "login" : "signup"); }
function startForgot(){ setMode("reset"); }
async function loadConfig(){ try{ const c = await (await fetch(`${API}/auth/config`)).json(); if(c && typeof c.otp_required === "boolean"){ CFG = c; refreshAuthUI(); } }catch{} }

function startCooldown(seconds){
  const btn = document.getElementById("otpBtn"); let left = seconds; btn.disabled = true;
  clearInterval(cooldownTimer);
  const tick = () => { if(left <= 0){ clearInterval(cooldownTimer); btn.disabled = false; btn.textContent = "Resend OTP"; } else { btn.textContent = `Resend in ${left}s`; left--; } };
  tick(); cooldownTimer = setInterval(tick, 1000);
}
async function postJson(path, body){
  const res = await fetch(`${API}${path}`, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  let data = {}; try{ data = await res.json(); }catch{}
  if(!res.ok){ const d = data.detail; throw new Error(typeof d === "string" ? d : (Array.isArray(d) ? "Please check what you entered (password needs at least 6 characters)." : "Something went wrong")); }
  return data;
}
const val = id => document.getElementById(id).value.trim();
function who(){ return {phone: val("a_phone"), email: val("a_email")}; }

async function sendOtp(){
  const w = who();
  if(mode === "signup" && !val("a_name")){ setMsg("Please enter your name first.", "err"); return; }
  if(w.phone.replace(/\D/g, "").length < 10){ setMsg("Enter your 10-digit mobile number.", "err"); return; }
  if(!/^\S+@\S+\.\S+$/.test(w.email || "")){ setMsg("Enter a valid email address.", "err"); return; }
  setMsg(""); const stop = wakeHint(document.getElementById("authMsg")); document.getElementById("otpBtn").disabled = true;
  try{
    const data = await postJson("/auth/otp/request", {...w, purpose: mode});
    stage = "sent"; refreshAuthUI();
    setMsg("We've sent a verification code to " + w.email + ". It is valid for 10 minutes. Not in your inbox? Check Spam / Promotions, then use Resend."
           + (mode === "reset" ? " (If the details do not match an account, no code is sent.)" : ""));
    startCooldown(data.cooldown || 30);
  }catch(e){ setMsg(e.message, "err"); document.getElementById("otpBtn").disabled = false; }
  finally{ stop(); }
}
async function verifyOtp(){
  const code = val("a_otp");
  if(code.length !== 6){ setMsg("Enter the 6-digit code.", "err"); return; }
  try{
    const data = await postJson("/auth/otp/verify", {...who(), code});
    verifyToken = data.verification_token; stage = "verified"; clearInterval(cooldownTimer);
    document.getElementById("a_phone").readOnly = true; refreshAuthUI();
    setMsg("✅ Verified. Now choose a password.", "ok");
  }catch(e){ setMsg(e.message, "err"); }
}
async function doAuth(){
  const w = who(), password = document.getElementById("a_pass").value, code = val("a_otp");
  if(mode === "login" && (!w.phone || !password)){ setMsg("Enter your phone number and password.", "err"); return; }
  if(mode === "signup" && !verifyToken){ setMsg("Please verify your email with the OTP first.", "err"); return; }
  if(mode === "signup" && !val("a_name")){ setMsg("Please enter your name.", "err"); return; }
  if(mode === "reset" && code.length !== 6){ setMsg("Enter the 6-digit code.", "err"); return; }
  if(mode !== "login" && password.length < 6){ setMsg("Password must be at least 6 characters.", "err"); return; }
  setMsg(""); const stop = wakeHint(document.getElementById("authMsg"));
  try{
    if(mode === "reset"){
      await postJson("/auth/password/reset", {...w, code, new_password: password});
      setMode("login"); document.getElementById("a_phone").value = w.phone;
      setMsg("✅ Password changed. Please log in with your new password.", "ok"); return;
    }
    const data = mode === "login" ? await postJson("/auth/login", {phone: w.phone, password})
                                  : await postJson("/auth/register", {name: val("a_name"), phone: w.phone, password, verification_token: verifyToken});
    resetUserState();                              // wipe the previous account's data first
    session = data;
    localStorage.setItem("ohub_session", JSON.stringify(session));
    enterApp(data.has_profile);
  }catch(e){ setMsg(e.message, "err"); }
  finally{ stop(); }
}

// Everything on screen that belongs to the account that was logged in. Called on logout AND before a new login,
// so a different student on the same browser never sees (or briefly flashes) someone else's data.
function resetUserState(){
  epoch++;                                         // answers still on their way for the old account are ignored when they arrive
  ALL = []; APPS = []; FILTER = "all";
  for(const id of ["p_state","p_study_state","p_gender","p_edu","p_stream","p_cat","p_age","p_marks","p_income"]) document.getElementById(id).value = "";
  for(const id of ["matchesList","appsList","accountBox"]) document.getElementById(id).innerHTML = "";
  document.getElementById("appCount").textContent = ""; document.getElementById("profMsg").textContent = "";
  for(const id of ["a_name","a_phone","a_email","a_otp","a_pass"]) document.getElementById(id).value = "";
  document.getElementById("a_phone").readOnly = false;
  showTab("matches");
}
function logout(){
  // No page reload: reloading a file:// page is blocked by some browsers. Just reset the screen.
  localStorage.removeItem("ohub_session"); session = null;
  resetUserState();
  for(const id of ["profileCard","matchesSection","logoutBtn"]) document.getElementById(id).style.display = "none";
  document.getElementById("authCard").style.display = "block";
  setMode("login");
  loadNotices();                                   // back to the public notices only
}

function enterApp(hasProfile){
  document.getElementById("authCard").style.display="none";
  document.getElementById("logoutBtn").style.display="block";
  loadAccount();
  if(hasProfile) loadMatches(); else showProfile();
}

async function showProfile(){
  const my = epoch;
  document.getElementById("matchesSection").style.display="none";
  document.getElementById("profileCard").style.display="block";
  try{
    const res = await fetch(`${API}/profile`,{headers:headers()});
    const p = await res.json();
    if(my !== epoch) return;                        // a different account is on screen now
    const q = p || {}, set = (id, v) => { document.getElementById(id).value = (v === null || v === undefined) ? "" : v; };
    set("p_state", q.state); set("p_study_state", q.study_state); set("p_age", q.age); set("p_gender", q.gender);
    set("p_edu", q.education_level); set("p_marks", q.marks_percent); set("p_stream", q.course_stream);
    set("p_income", q.family_income); set("p_cat", q.category);
  }catch{}
}

async function saveProfile(){
  const msg = document.getElementById("profMsg"); msg.className="msg"; msg.textContent="Saving…";
  const num = id => { const v = document.getElementById(id).value; return v ? Number(v) : null; };
  const str = id => document.getElementById(id).value || null;
  try{
    const res = await fetch(`${API}/profile`,{method:"POST",headers:jsonHeaders(),body:JSON.stringify({
      country:"IN", state:str("p_state"), study_state:str("p_study_state"), age:num("p_age"), gender:str("p_gender"),
      education_level:str("p_edu"), marks_percent:num("p_marks"), course_stream:str("p_stream"),
      family_income:num("p_income"), category:str("p_cat"), is_disabled:false
    })});
    if(!res.ok) throw new Error("Couldn't save");
    msg.textContent=""; loadMatches();
  }catch(e){ msg.textContent=e.message; msg.classList.add("err"); }
}

async function loadMatches(){
  const my = epoch;
  document.getElementById("profileCard").style.display="none";
  const section = document.getElementById("matchesSection");
  const list = document.getElementById("matchesList");
  section.style.display="block";
  loadNotices();
  loadApps();
  list.innerHTML = `<div class="empty">Finding opportunities for you…</div>`;
  const wake = setTimeout(()=>{ list.innerHTML = `<div class="empty">${WAKE_TEXT}</div>`; }, 6000);
  try{
    const res = await fetch(`${API}/opportunities/matches`,{headers:headers()});
    clearTimeout(wake);
    const data = await res.json();
    if(my !== epoch) return;
    if(res.status === 401){ logout(); return; }   // stale/expired login -> show the login form again
    if(!res.ok) throw new Error(data.detail || "Couldn't load");
    render(data.matches || []);
  }catch(e){ clearTimeout(wake); if(my === epoch) list.innerHTML = `<div class="empty">${e.message}</div>`; }
}

let ALL = [], FILTER = "all";
function setFilter(f){ FILTER = f; render(ALL); }
function urgency(m){
  if(m.days_left == null) return "";
  const d = m.days_left, cls = d <= 7 ? "urgent" : d <= 30 ? "soon" : "later";
  return `<span class="tag ${cls}">⏰ ${d === 0 ? "Aaj aakhri din!" : d + (d === 1 ? " din baaki" : " din baaki")}</span>`;
}
function card(m){
  return `
  <div class="opp ${m.match}">
    <span class="tag ${m.match}">${m.match==="high"?"Strong match":"Check eligibility"}</span>
    <span class="tag scope">${m.scope==="state" ? "📍 "+esc(m.state)+" only" : "🇮🇳 All India"}</span>${urgency(m)}
    <h3>${esc(m.name)}</h3>
    ${m.amount_text?`<p class="amt">💰 ${esc(m.amount_text)}</p>`:""}
    <p><b>Deadline:</b> ${m.deadline ? m.deadline : "Official site pe check karo"}</p>
    ${m.matched_conditions.length?`<p class="why">✅ Kyun mil sakti hai / Why you may qualify: ${m.matched_conditions.map(esc).join(" · ")}</p>`:""}
    ${m.unknown_fields.length?`<p>⚠️ Tumne ye nahi bhara: <b>${m.unknown_fields.map(esc).join(", ")}</b> — official page pe khud check kar lo.</p>`:""}
    ${m.description?`<p>${esc(m.description)}</p>`:""}
    ${m.benefits?`<p><b>Benefits:</b> ${esc(m.benefits)}</p>`:""}
    ${m.required_documents.length?`<p><b>Documents:</b> ${m.required_documents.map(esc).join(", ")}</p>`:""}
    ${m.application_steps && m.application_steps.length ? `<details class="steps"><summary>How to apply · आवेदन कैसे करें — ${m.application_steps.length} steps</summary><ol>${m.application_steps.map((s,i)=>`<li>${esc(s)}${(m.application_steps_hi||[])[i]?`<br><span class="hi">${esc(m.application_steps_hi[i])}</span>`:""}</li>`).join("")}</ol></details>` : ""}
    <div class="src">
      Source: ${esc(m.source_organization||"—")} · Last verified: ${m.last_verified||"not verified yet"}
      ${m.stale?`<p class="stale">⚠️ Ye jaankari haal hi mein verify nahi hui — apply se pehle official site pe check kar lo.</p>`:""}
    </div>
    <a class="applybtn" href="${esc(m.official_url)}" target="_blank" rel="noopener">Apply Karo → Official site</a>
    <button class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="saveMatch('${m.id}', this)">${m.saved_status ? "✓ Tracking · My applications me dekho" : "🔖 Save / Track this"}</button>
    <p class="hint" style="margin:8px 0 0;font-size:12px">Official site pe apply karne ke baad yahan "My applications" me status update karte raho.</p>
  </div>`;
}
function render(matches){
  ALL = matches;
  const list = document.getElementById("matchesList");
  if(!matches.length){
    list.innerHTML = `<div class="empty">Abhi koi matching opportunity nahi mili.<br>Apni details check karo ya baad me dekho — naye schemes add hote rehte hain.</div>`;
    return;
  }
  const shown = matches.filter(m => FILTER==="all" || (FILTER==="india" ? m.scope!=="state" : m.scope==="state"));
  const high = matches.filter(m=>m.match==="high").length;
  const chip = (f,l)=>`<button class="chip ${FILTER===f?"on":""}" onclick="setFilter('${f}')">${l}</button>`;
  list.innerHTML = `<div class="hint"><b>${matches.length} opportunities</b> mili — ${high} me tum poori tarah eligible lagte ho.</div>`
    + `<div class="row" style="margin:0 0 12px">${chip("all","All")}${chip("india","🇮🇳 All India")}${chip("state","📍 My state")}</div>`
    + (shown.length ? shown.map(card).join("") : `<div class="empty">Is filter mein kuch nahi mila.</div>`);
}

// Government announcements (public — shown before and after login). Only admin-approved notices appear.
async function loadNotices(){
  const box = document.getElementById("noticesBox"), my = epoch;
  try{
    let st = "";
    if(session){ try{ const p = await (await fetch(`${API}/profile`,{headers:headers()})).json(); st = (p && p.state) || ""; }catch{} }
    const items = await (await fetch(`${API}/notices?state=${encodeURIComponent(st)}`)).json();
    if(my !== epoch) return;
    if(!Array.isArray(items) || !items.length){ box.innerHTML = ""; return; }
    box.innerHTML = `<div class="card"><h2>📢 Latest notices · ताज़ा सूचनाएं</h2>` + items.map(n=>`
      <div class="notice"><b>${esc(n.title)}</b>
        <span class="nmeta">${esc(n.published_on||"")} · ${esc(n.state||"All India")}${n.source_name?" · "+esc(n.source_name):""}</span>
        ${n.auto_found?`<span class="nmeta">⚠️ Auto-detected from the official portal — please read the notice itself.</span>`:""}
        ${n.summary?`<p>${esc(n.summary)}</p>`:""}${n.scheme?`<p>Related: ${esc(n.scheme)}</p>`:""}
        <a href="${esc(n.url)}" target="_blank" rel="noopener">Official notice →</a></div>`).join("") + `</div>`;
  }catch{ box.innerHTML = ""; }
}

// ---------- My applications: the student records what happens on the official portal ----------
const STATUSES = [
  ["saved", "🔖 Saved"], ["applied", "📨 Applied"], ["under_review", "🔍 Under verification"],
  ["approved", "✅ Approved"], ["received", "💰 Money received"], ["rejected", "❌ Rejected"],
];
let APPS = [];
function showTab(t){
  const apps = t === "apps";
  document.getElementById("matchesList").style.display = apps ? "none" : "block";
  document.getElementById("appsList").style.display = apps ? "block" : "none";
  document.getElementById("tabMatches").classList.toggle("on", !apps);
  document.getElementById("tabApps").classList.toggle("on", apps);
  if(apps) loadApps();
}
async function saveMatch(id, btn){
  btn.disabled = true;
  try{
    const res = await fetch(`${API}/opportunities/save`, {method:"POST", headers:jsonHeaders(), body:JSON.stringify({opportunity_id:id})});
    btn.textContent = res.ok ? "✓ Saved · My applications me dekho" : "Save nahi hua, dobara try karo";
    if(res.ok) loadApps();
  }catch{ btn.textContent = "Save nahi hua, dobara try karo"; }
  btn.disabled = false;
}
async function loadApps(){
  const my = epoch;
  try{
    const res = await fetch(`${API}/opportunities/saved`, {headers:headers()});
    if(res.status === 401){ logout(); return; }
    const list = await res.json();
    if(my !== epoch) return;
    APPS = list;
    document.getElementById("appCount").textContent = APPS.length ? `(${APPS.length})` : "";
    renderApps();
  }catch{}
}
function appCard(a){
  const rank = STATUSES.map(s=>s[0]), stale = ["applied","under_review"].includes(a.status) && a.updated_days != null && a.updated_days >= 7;
  let tip = "";
  if(a.expired) tip = `<div class="tip">Is scholarship ki deadline nikal gayi. Agle saal dobara khulne par yahan wapas dikhegi.</div>`;
  else if(a.status === "saved" && a.days_left != null && a.days_left <= 7) tip = `<div class="tip bad">⚠️ Deadline sirf ${a.days_left} din door hai — abhi official site pe apply karo.</div>`;
  else if(stale) tip = `<div class="tip">⏰ ${a.updated_days} din se update nahi hua. Official portal pe status dekho aur yahan badlo.</div>`;
  else if(a.status === "rejected") tip = `<div class="tip bad"><b>Ab kya karein:</b> portal pe reject hone ki wajah padho aur neeche note me likho. Agar "defective" ya kami thi to deadline se pehle sudhar ke dobara bhejo. Aur scholarships bhi dekho — "My scholarships" tab.</div>`;
  else if(a.status === "approved") tip = `<div class="tip good">🎉 Mubarak! Paisa aane tak bank account Aadhaar se linked rakho. Paisa mil jaye to status "Money received" kar do.</div>`;
  return `
  <div class="opp ${a.status==="rejected"?"":"high"}">
    <h3>${esc(a.name)}</h3>
    <p>${a.state?"📍 "+esc(a.state):"🇮🇳 All India"}${a.deadline?` · Deadline: ${a.deadline}${a.days_left!=null&&a.days_left>=0?` (${a.days_left} din baaki)`:""}`:""}${a.applied_on?` · Applied: ${a.applied_on}`:""}</p>
    <div class="appgrid">
      <div><label>Status</label><select id="st_${a.id}" onchange="updateApp('${a.id}')">${STATUSES.map(([v,l])=>`<option value="${v}" ${v===a.status?"selected":""}>${l}</option>`).join("")}</select></div>
      <div><label>Application ID (portal se)</label><input id="aid_${a.id}" value="${esc(a.application_id||"")}" placeholder="optional" onchange="updateApp('${a.id}')"/></div>
    </div>
    <div style="margin-top:8px"><label>Note</label><input id="note_${a.id}" value="${esc(a.note||"")}" placeholder="jaise: documents pending, reject reason..." onchange="updateApp('${a.id}')"/></div>
    ${tip}
    <div class="src"><a href="${esc(a.official_url)}" target="_blank" rel="noopener">Official portal pe status check karo →</a>
      · <a href="#" onclick="removeApp('${a.id}');return false">Hatao</a><br>Portal ka password kabhi yahan mat daalna.</div>
  </div>`;
}
function renderApps(){
  const box = document.getElementById("appsList");
  if(!APPS.length){ box.innerHTML = `<div class="empty">Abhi kuch save nahi kiya.<br>"My scholarships" me kisi card pe <b>Save / Track this</b> dabao.</div>`; return; }
  const order = STATUSES.map(s=>s[0]);
  const sorted = [...APPS].sort((x,y)=> order.indexOf(x.status)-order.indexOf(y.status) || (x.days_left ?? 9999)-(y.days_left ?? 9999));
  const counts = STATUSES.map(([v,l])=>[l, APPS.filter(a=>a.status===v).length]).filter(c=>c[1]).map(([l,n])=>`${l.split(" ·")[0]} ${n}`).join("  ·  ");
  box.innerHTML = `<div class="hint"><b>${APPS.length}</b> scholarships track ho rahi hain — ${counts}</div>` + sorted.map(appCard).join("");
}
async function updateApp(id){
  const body = {opportunity_id:id, status:document.getElementById("st_"+id).value,
                application_id:document.getElementById("aid_"+id).value.trim() || null, note:document.getElementById("note_"+id).value.trim() || null};
  await fetch(`${API}/opportunities/save`, {method:"POST", headers:jsonHeaders(), body:JSON.stringify(body)});
  loadApps();
}
async function removeApp(id){
  if(!confirm("Is scholarship ko apni list se hataye?")) return;
  await fetch(`${API}/opportunities/saved/${id}`, {method:"DELETE", headers:headers()});
  loadApps();
}

// ---------- accounts without an email (made before email verification existed) ----------
async function postAuthed(path, body){
  const res = await fetch(`${API}${path}`, {method:"POST", headers:jsonHeaders(), body:JSON.stringify(body)});
  let data = {}; try{ data = await res.json(); }catch{}
  if(res.status === 401){ logout(); throw new Error("Please log in again."); }
  if(!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Something went wrong");
  return data;
}
async function loadAccount(){
  const my = epoch, box = document.getElementById("accountBox");
  try{
    const res = await fetch(`${API}/auth/me`, {headers:headers()});
    if(res.status === 401){ logout(); return; }
    const me = await res.json();
    if(my !== epoch) return;
    if(me.has_email){ box.innerHTML = ""; return; }
    box.innerHTML = `<div class="card"><h2>Add your email</h2>
      <div class="hint">Your account has no email yet, so "Forgot password" cannot work for you. Add one now — it takes a minute.</div>
      <div class="grid"><div><label>Email</label><input id="m_email" type="email" autocomplete="off" placeholder="you@example.com"/></div>
        <div id="m_codeBox" style="display:none"><label>Code from your email</label><input id="m_code" inputmode="numeric" maxlength="6" oninput="cleanNum(this)" placeholder="6-digit code"/></div></div>
      <div class="row"><button class="btn" id="m_send" onclick="sendAddEmail()">Send code</button>
        <button class="btn" id="m_verify" style="display:none" onclick="verifyAddEmail()">Verify &amp; save</button></div>
      <div class="msg" id="m_msg"></div></div>`;
  }catch{}
}
async function sendAddEmail(){
  const msg = document.getElementById("m_msg"), email = document.getElementById("m_email").value.trim(); msg.className = "msg";
  if(!/^\S+@\S+\.\S+$/.test(email)){ msg.textContent = "Enter a valid email address."; msg.classList.add("err"); return; }
  document.getElementById("m_send").disabled = true; msg.textContent = "";
  try{
    await postAuthed("/auth/email/request", {email});
    document.getElementById("m_codeBox").style.display = ""; document.getElementById("m_verify").style.display = "";
    msg.textContent = "Code sent to " + email + ". Not in your inbox? Check Spam / Promotions.";
    setTimeout(()=>{ const b = document.getElementById("m_send"); if(b){ b.disabled = false; b.textContent = "Resend code"; } }, 30000);
  }catch(e){ msg.textContent = e.message; msg.classList.add("err"); document.getElementById("m_send").disabled = false; }
}
async function verifyAddEmail(){
  const msg = document.getElementById("m_msg"), email = document.getElementById("m_email").value.trim(), code = document.getElementById("m_code").value.trim(); msg.className = "msg";
  if(code.length !== 6){ msg.textContent = "Enter the 6-digit code."; msg.classList.add("err"); return; }
  try{
    await postAuthed("/auth/email/verify", {email, code});
    document.getElementById("accountBox").innerHTML = `<div class="card"><div class="msg ok">✅ Email added. You can now use "Forgot password" if you ever need it.</div></div>`;
    setTimeout(()=>{ document.getElementById("accountBox").innerHTML = ""; }, 6000);
  }catch(e){ msg.textContent = e.message; msg.classList.add("err"); }
}

function esc(s){ const d=document.createElement("div"); d.textContent=s==null?"":s; return d.innerHTML; }

setMode("signup"); loadConfig();
if(session) enterApp(true); else loadNotices();
</script>
<script>
/* Section navigation (Scholarships / Farmers / Career guidance). Does not touch login or any existing function. */
window.__hubStates = STATES;
function hubGo(sec){
  if(!["scholarships","farmers","careers"].includes(sec)) sec="scholarships";
  for(const k of ["scholarships","farmers","careers"]) document.getElementById("sec-"+k).style.display = k===sec ? "" : "none";
  document.querySelectorAll("#hubNav .chip").forEach(b=>b.classList.toggle("on", b.dataset.sec===sec));
  if(sec==="scholarships") document.body.removeAttribute("data-theme"); else document.body.dataset.theme = sec;   // colour theme per section
  const tc=document.querySelector('meta[name="theme-color"]'); if(tc) tc.content = getComputedStyle(document.body).getPropertyValue("--brand").trim() || "#6B21A8";
  if(sec==="farmers" && window.farmersInit) farmersInit();
  if(sec==="careers" && window.careersInit) careersInit();
  if(location.hash.slice(1)!==sec) history.replaceState(null,"","#"+sec);
  window.scrollTo(0,0);
}
document.querySelectorAll("#hubNav .chip").forEach(b=>b.onclick=()=>hubGo(b.dataset.sec));
window.addEventListener("hashchange",()=>hubGo(location.hash.slice(1)));
// run after farmers.js / careers.js have loaded, so a direct link like /#farmers works
window.addEventListener("load",()=>{ if(["farmers","careers"].includes(location.hash.slice(1))) hubGo(location.hash.slice(1)); });
</script>
<script src="farmers.js"></script>
<script src="careers.js"></script>
</body>
